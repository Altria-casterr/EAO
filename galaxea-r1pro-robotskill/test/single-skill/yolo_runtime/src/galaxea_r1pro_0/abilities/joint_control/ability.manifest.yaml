abilityName: JointControl.Demo
kind: AtomAbility
schema:
  config:
    openAPIV3Schema:
      description: 能力配置结构
      properties:
        robotProfilePath:
          description: R1 Pro SDK profile 路径
          type: string
  debugOption:
    openAPIV3Schema:
      description: 调试选项结构，不会影响业务行为，只会留下额外的调试信息
      properties:
        logPictureWhenDetecting:
          default: false
          description: 如果是，则识别能力在运行时会将图片和识别结果保存到本地
          type: bool
      type: object
tasks:
- taskName: control_single_arm_joint
  taskType: 0
  abilityRole: manipulator_motion
  actionType: motion.move_to_posture_single
  schemaVersion: 2
  physical: true
  summary: 控制单臂关节移动到目标位置（发布目标后轮询实际关节位置直到到位或超时）
  params:
  - name: invocation_id
    type: string
    optional: true
    description: 幂等调用 ID，用于查询/停止本次执行（可选）
  - name: arm_side
    type: string
    optional: true
    default: left
    description: 控制的手臂侧，仅支持 left 或 right，默认 left
  - name: positions
    type: array
    items:
      type: float
    optional: false
    description: 目标关节角度数组（弧度），顺序对应 joint_names
  - name: joint_names
    type: array
    items:
      type: string
    optional: false
    description: 关节名称数组，必须与 positions 非空且等长
  - name: velocities
    type: array
    items:
      type: float
    optional: true
    description: 关节运动速度数组（可选，与 positions 等长）
  - name: effort
    type: array
    items:
      type: float
    optional: true
    description: 关节力矩限制数组（可选，与 positions 等长）
  - name: tol
    type: float
    optional: true
    default: 0.01
    description: 到位容差（弧度），默认 0.01
  - name: timeout
    type: float
    optional: true
    default: 10.0
    description: 运动超时时间，单位秒，默认 10.0
  - name: loop_freq
    type: float
    optional: true
    default: 0.2
    description: 关节位置轮询间隔，单位秒，默认 0.2
  returns:
  - name: None
    type: object
    description: 输出为执行记录字典，示例 {"invocation_id":"j1","task_name":"control_single_arm_joint","status":"running","command_id":"..."}
    properties:
      output:
        type: object
        description: 执行记录快照
        properties:
          invocation_id:
            type: string
            description: 调用 ID
          task_name:
            type: string
            description: 任务名
          status:
            type: string
            description: 执行状态（running/completed/failed/stopped/interrupted）
          progress:
            type: float
            description: 执行进度
          phase:
            type: string
            description: 当前阶段
          command_id:
            type: string
            description: 底层命令 ID
          result:
            type: object
            description: 命令结果
          error:
            type: object
            description: 错误信息（失败时）
      message:
        type: string
        description: 任务执行说明
- taskName: control_both_arms_joint
  taskType: 1
  abilityRole: manipulator_motion
  actionType: motion.move_to_posture_both
  schemaVersion: 2
  physical: true
  summary: 控制双臂关节同时移动到目标位置（左右并行发布，两侧均到位才算成功）
  params:
  - name: invocation_id
    type: string
    optional: true
    description: 幂等调用 ID，用于查询/停止本次执行（可选）
  - name: left_positions
    type: array
    items:
      type: float
    optional: false
    description: 左臂目标关节角度数组（弧度），顺序对应 left_joint_names
  - name: right_positions
    type: array
    items:
      type: float
    optional: false
    description: 右臂目标关节角度数组（弧度），顺序对应 right_joint_names
  - name: left_joint_names
    type: array
    items:
      type: string
    optional: false
    description: 左臂关节名称数组，必须与 left_positions 非空且等长
  - name: right_joint_names
    type: array
    items:
      type: string
    optional: false
    description: 右臂关节名称数组，必须与 right_positions 非空且等长
  - name: left_velocities
    type: array
    items:
      type: float
    optional: true
    description: 左臂关节运动速度数组（可选，与 left_positions 等长）
  - name: right_velocities
    type: array
    items:
      type: float
    optional: true
    description: 右臂关节运动速度数组（可选，与 right_positions 等长）
  - name: left_effort
    type: array
    items:
      type: float
    optional: true
    description: 左臂关节力矩限制数组（可选，与 left_positions 等长）
  - name: right_effort
    type: array
    items:
      type: float
    optional: true
    description: 右臂关节力矩限制数组（可选，与 right_positions 等长）
  - name: tol
    type: float
    optional: true
    default: 0.01
    description: 左右共用到位容差（弧度），默认 0.01
  - name: timeout
    type: float
    optional: true
    default: 10.0
    description: 左右共用运动超时时间，单位秒，默认 10.0
  - name: loop_freq
    type: float
    optional: true
    default: 5.0
    description: 左右共用关节位置轮询间隔，单位秒，默认 5.0
  returns:
  - name: None
    type: object
    description: 输出为执行记录字典，示例 {"invocation_id":"jb","task_name":"control_both_arms_joint","status":"running","command_id":"..."}
    properties:
      output:
        type: object
        description: 执行记录快照
        properties:
          invocation_id:
            type: string
            description: 调用 ID
          task_name:
            type: string
            description: 任务名
          status:
            type: string
            description: 执行状态（running/completed/failed/stopped/interrupted）
          progress:
            type: float
            description: 执行进度
          phase:
            type: string
            description: 当前阶段
          command_id:
            type: string
            description: 底层命令 ID（主记录：左臂）
          result:
            type: object
            description: 命令结果
          error:
            type: object
            description: 错误信息（失败时）
      message:
        type: string
        description: 任务执行说明
- taskName: GetExecution
  taskType: 2
  summary: 查询本 Ability 启动的语义执行
  params:
  - name: invocation_id
    type: string
    optional: false
    description: 调用 ID
  returns:
  - name: None
    type: object
    description: 输出为字典结构，示例 {"output":{"invocation_id":"j1","status":"running",...},"message":"查询执行记录"}
    properties:
      output:
        type: object
        description: 执行记录快照
        properties:
          invocation_id:
            type: string
            description: 调用 ID
          status:
            type: string
            description: 执行状态（running/completed/failed/stopped/interrupted）
          command_id:
            type: string
            description: 底层命令 ID
          progress:
            type: float
            description: 执行进度
      message:
        type: string
        description: 任务执行说明
- taskName: StopExecution
  taskType: 3
  summary: 停止底层命令并让相关资源进入 hold
  params:
  - name: invocation_id
    type: string
    optional: false
    description: 调用 ID
  - name: reason
    type: string
    optional: true
    description: 停止原因（可选，默认为 pilot stop）
  returns:
  - name: None
    type: object
    description: 输出为字典结构，示例 {"output":{"invocation_id":"j1","status":"stopped",...},"message":"停止底层命令"}
    properties:
      output:
        type: object
        description: 停止后的执行记录
        properties:
          invocation_id:
            type: string
            description: 调用 ID
          status:
            type: string
            description: 执行状态（stopped/interrupted）
          phase:
            type: string
            description: 停止阶段（held/stop_unconfirmed）
      message:
        type: string
        description: 任务执行说明
