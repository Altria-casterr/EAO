# 基于现有双臂部署元数据；机器人动作通过外部 Ability 执行。
# instance_id 为 2026-10-06 /api/ability-heartbeat 中 Running 的三个实例；Ability 重新激活后需更新。
api_version: 1
robot:
  id: r1pro-galaxea-real
  display_name: R1 Pro Galaxea Real - Force Place
  model: r1pro
  backend: real
  sdk:
    package: semantic-robot-sdk-r1pro
    firmware_profile: fake-v1
    providers:
      kinematics: fake
      motion: local
      navigation: local
    options:
      auto_complete: true
      stop_confirmed: true
  frames:
    world: map
    base: base_link
    end_effectors:
      left: left_tote_load_frame
      right: right_tote_load_frame
  safety:
    maximum_base_speed: 0.4
    maximum_joint_speed: 0.5
ability_framework:
  endpoint: http://127.0.0.1:8080
  managed_by_instance: false
pilot:
  id: pilot-place-object-force
  worker_timeout_seconds: 1800
  heartbeat_interval_seconds: 2
  allow_ability_debug: true
abilities:
  robot:
    instance_id: 4171b26f-ab5a-4108-9776-6362f84ac08c
  torso:
    instance_id: ab58a7af-376a-4818-b38e-ecfb584989e8
  manipulator_motion:
    instance_id: d9fc2922-45b8-4362-8373-de24976a66c4
