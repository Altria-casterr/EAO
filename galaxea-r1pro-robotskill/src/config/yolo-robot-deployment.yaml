api_version: 1
robot:
  id: r1pro-galaxea-real
  display_name: R1 Pro Galaxea Real (external AF)
  model: r1pro
  backend: real
  sdk:
    package: semantic-robot-sdk-r1pro
    firmware_profile: fake-v1
    providers:
      kinematics: fake
      motion: local
      navigation: local
    options:
      auto_complete: true
      stop_confirmed: true
  frames:
    world: world
    base: base_link
    end_effectors:
      left: left_tote_load_frame
      right: right_tote_load_frame
  safety:
    maximum_base_speed: 0.4
    maximum_joint_speed: 0.5
ability_framework:
  endpoint: http://127.0.0.1:8080
  managed_by_instance: false
abilities:
  perception: { instance_id: "f37776a7-8bdb-494f-baa2-5afd7b3d841a" }
pilot:
  id: pilot-yolo-detect-test
  worker_timeout_seconds: 300
  heartbeat_interval_seconds: 2
  allow_ability_debug: true
