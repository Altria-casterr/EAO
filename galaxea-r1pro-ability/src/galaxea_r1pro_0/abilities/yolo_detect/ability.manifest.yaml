    optional: true
    type: int
  - description: 完整内参 fx/fy/cx/cy，对应对齐后图像分辨率
    name: camera_intrinsics
    optional: true
    type: object
  - description: camera_to_base，或 camera_to_tcp + tcp_frame/当次 tcp_to_base；六维格式平移毫米、旋转弧度
