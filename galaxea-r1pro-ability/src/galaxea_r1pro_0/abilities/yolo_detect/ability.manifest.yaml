    description: fast_voxel（默认）或 legacy_dbscan；距离参数使用米，见 README
  - name: refine_mask
    type: bool
    optional: true
    description: 是否执行参考脚本的深度掩码清理，默认 true
  - name: transform_timeout_s
    type: float
