    description: 动态 TF 等待时限，默认 2 秒
  - name: transform_max_age_s
    type: float
    optional: true
    description: 动态 TF 自最后更新的最大时间，默认 1 秒
  returns:
  - description: 结果使用真实 robot_frame；center_robot 为过滤后完整点云的包围盒中心，附实际变换与 filter_stats
    name: None
    type: object
  summary: 根据目标点匹配距离最近的 YOLO 分割目标
  taskName: match_target
  abilityRole: perception
  actionType: perception.match_target
  schemaVersion: 2
  physical: false
  taskType: 2
- params:
  - description: 幂等调用 ID
    name: invocation_id
    optional: true
    type: string
  - description: 可选参考点云 N×3，单位米，需 reference_frame；未提供则读取独立标定的参考 RGB-D
    name: reference_points
    optional: true
    type: array
  - description: 目标点，机器人本体坐标系，单位米；先匹配最近箱子，再生成目标点云用于姿态估计
    name: target_point
    optional: false
    type: array
  - description: X 方向最大偏差，单位米
    name: delta_threshold_x
    optional: true
    type: float
  - description: Y 方向最大偏差，单位米
    name: delta_threshold_y
    optional: true
    type: float
  - description: Z 方向最大偏差，单位米
