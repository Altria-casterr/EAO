  taskType: 3
- params:
  - description: 调用 ID
    name: invocation_id
    optional: false
    type: string
  returns:
  - description: 输出为执行记录字典
    name: None
    type: object
  summary: 查询本 Ability 启动的语义执行
  taskName: GetExecution
  taskType: 4
- params:
  - description: 调用 ID
    name: invocation_id
    optional: false
    type: string
  - description: 停止原因
    name: reason
    optional: true
    type: string
  returns:
  - description: 输出为执行记录字典
    name: None
    type: object
  summary: 停止底层命令并让相关资源进入 hold
  taskName: StopExecution
  taskType: 5
