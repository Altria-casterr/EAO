    optional: true
    description: 动态 TF 自最后更新的最大时间，默认 1 秒
  - name: reference_camera
    type: object
    optional: true
    description: 参考图片拍摄时的独立完整标定，禁止使用实时 TF
  - name: reference_frame
    type: string
    optional: true
    description: 直接传入参考点云时必填，必须与目标 robot_frame 相同
  - name: reference_target_point
    type: array
    optional: true
