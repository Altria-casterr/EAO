    optional: true
    type: float
  - description: YOLO IoU 阈值
    name: iou_threshold
    optional: true
    type: float
  - description: Yaw 搜索范围，单位度
    name: yaw_range
    optional: true
    type: array
  - description: 粗搜索步长，单位度
    name: search_step
