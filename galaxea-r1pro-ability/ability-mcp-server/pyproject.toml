[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ability-mcp-server"
version = "0.1.0"
description = "Native MCP server that exposes AbilityFramework HTTP API + per-task tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AbilityFramework Contributors" }]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "pydantic>=2.5",
    "anyio>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
ability-mcp-native = "ability_mcp.native.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
